<!doctype html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#0b2b50">

<link rel="apple-touch-icon" href="icon-512.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="R19">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">

  <title>R19 Management</title>

  <!-- Microsoft Authentication Library -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.26.2/lib/msal-browser.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --background: #090a0b;
      --panel: #151617;
      --card: #232426;
      --border: #3a3b3e;
      --text: #ffffff;
      --muted: #a7a7a9;
      --yellow: #f4c430;
      --yellow-light: #ffd84d;
      --yellow-dark: #d9aa00;
      --green: #34d399;
      --red: #fb7185;
      --purple: #f4c430;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);

      background:
        radial-gradient(circle at 10% 0%, #221a4a, transparent 35%),
        radial-gradient(circle at 100% 0%, #082c22, transparent 28%),
        var(--background);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 26px auto;
      padding: clamp(18px, 3vw, 34px);

      background: rgba(17, 21, 26, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 28px;

      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.48);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 40px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand-mark {
      width: 68px;
      height: 68px;

      display: grid;
      place-items: center;

      border-radius: 20px;
      background: linear-gradient(135deg, #7657ff, #4f85ff);

      font-size: 36px;
      box-shadow: 0 15px 35px rgba(124, 92, 255, 0.3);
    }
.brand-mark img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
    .brand h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 43px);
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status,
    .button {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #171c22;
      color: white;
      padding: 12px 15px;
    }

    .status {
      color: #b0bac5;
      font-size: 14px;
    }

    .status.connected {
      color: #a7f3d0;
      border-color: #28634e;
    }

    .button {
      font-weight: 750;
    }

    .button:hover {
      border-color: #55606d;
    }

    .button.primary {
      border: none;
      background: linear-gradient(135deg, var(--purple), #527cff);
    }

    .button.danger {
      color: #ffc0ca;
    }

    .button.small {
      padding: 8px 10px;
      font-size: 13px;
    }

    .intro h2 {
      margin: 0 0 8px;
      font-size: clamp(34px, 5vw, 52px);
    }

    .intro p {
      margin: 0 0 40px;
      color: var(--muted);
      font-size: 20px;
    }

    .folder-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .folder-card {
      position: relative;
      min-height: 275px;
      overflow: hidden;

      padding: 30px;
      text-align: left;

      border: 1px solid var(--border);
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.035),
          rgba(255, 255, 255, 0.01)
        );

      color: white;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .folder-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 6px;
      background: var(--folder-color);
    }

    .folder-card:hover {
      transform: translateY(-4px);
      border-color: var(--folder-color);
    }

    .folder-icon {
      display: block;
      margin: 28px 0;
      font-size: 48px;
    }

    .folder-card h3 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .folder-count {
      color: var(--muted);
      font-size: 17px;
    }

    .footer-note {
      margin-top: 28px;
      color: var(--muted);
      line-height: 1.5;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .section-header h2 {
      margin: 18px 0 5px;
      font-size: 34px;
    }

    .section-subtitle {
      color: var(--muted);
    }

    .panel,
    .list-item {
      margin-top: 16px;
      padding: 18px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .panel h3 {
      margin: 0 0 15px;
    }

    label {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    textarea {
      width: 100%;
      margin: 7px 0 12px;
      padding: 12px 13px;

      background: #0d1115;
      color: white;

      border: 1px solid var(--border);
      border-radius: 13px;

      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--purple);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .list-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: start;
    }

    .list-item.completed {
      opacity: 0.65;
    }

    .list-item.completed .item-title {
      text-decoration: line-through;
    }

    .checkbox {
      width: 23px;
      height: 23px;
      accent-color: var(--purple);
    }

    .item-title {
      font-size: 17px;
      font-weight: 850;
    }

    .item-notes {
      margin-top: 8px;
      color: #c3cbd4;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .item-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .attachment {
      padding: 7px 9px;

      border: 1px solid var(--border);
      border-radius: 10px;

      color: #b7aaff;
      font-size: 12px;
    }

    .item-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .contact a {
      display: inline-block;
      margin: 8px 15px 0 0;
      color: #b8a9ff;
      text-decoration: none;
    }

    .empty {
      margin-top: 16px;
      padding: 30px;

      text-align: center;
      color: var(--muted);

      border: 1px dashed var(--border);
      border-radius: 18px;
    }

    @media (max-width: 920px) {
      .folder-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 18px;
        border-radius: 0;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
      }

      .top-actions .button {
        flex: 1;
      }

      .brand-mark {
        width: 52px;
        height: 52px;
        font-size: 27px;
      }

      .folder-grid {
        grid-template-columns: 1fr;
      }

      .folder-card {
        min-height: 190px;
      }

      .folder-icon {
        margin: 15px 0;
      }

      .list-item {
        grid-template-columns: auto 1fr;
      }

      .item-actions {
        grid-column: 2;
        justify-content: flex-start;
      }
    }

    /* R19 portada amarilla */
    body { margin:0; min-height:100vh; padding-bottom:86px; background:var(--background); }
    .shell { width:min(760px,100%); min-height:100vh; margin:0 auto; padding:0 18px 110px; background:var(--background); border:0; border-radius:0; box-shadow:0 0 70px rgba(0,0,0,.45); }
    .hero { position:relative; min-height:390px; margin:0 -18px; overflow:hidden; background:linear-gradient(to bottom,rgba(0,0,0,.04) 35%,rgba(0,0,0,.9) 100%),url("r19-building.jpg") center/cover no-repeat; }
    .hero-top { position:relative; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:24px 22px; }
    .hero-brand { display:flex; align-items:center; gap:12px; }
    .hero-logo { width:52px; height:52px; object-fit:cover; border-radius:14px; }
    .hero-logo-text strong { display:block; font-size:25px; line-height:1; }
    .hero-logo-text span { display:block; margin-top:5px; color:#ffffffd1; font-size:10px; font-weight:800; letter-spacing:2px; }
    .profile-button { width:48px; height:48px; display:grid; place-items:center; border:2px solid white; border-radius:50%; background:#0003; color:white; font-size:24px; }
    .hero-title { position:absolute; z-index:2; left:22px; right:22px; bottom:28px; }
    .hero-title h1 { margin:0; font-size:clamp(34px,8vw,48px); line-height:1.05; }
    .hero-title p { margin:7px 0 0; color:#ffffffe6; font-size:clamp(20px,5vw,27px); }
    .dashboard { position:relative; z-index:3; margin:-18px -2px 0; padding:30px 18px 28px; border:1px solid #ffffff14; border-radius:34px 34px 0 0; background:linear-gradient(145deg,#242527,#111213 75%); }
    .dashboard h2 { margin:0 0 24px; font-size:clamp(29px,7vw,39px); }
    .folder-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:17px; }
    .folder-card { position:relative; min-width:0; min-height:175px; overflow:hidden; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; padding:20px; border:1px solid #ffffff1a; border-radius:24px; background:linear-gradient(145deg,#313235,#202123); color:white; text-align:left; box-shadow:0 12px 25px #00000038; }
    .folder-card::before { display:none; }
    .folder-card.accent { border-color:var(--yellow-dark); background:linear-gradient(145deg,var(--yellow-light),var(--yellow)); color:#202124; }
    .folder-card:hover,.folder-card:active { transform:translateY(-2px); border-color:var(--yellow); }
    .folder-icon { display:block; margin:0 0 auto; font-size:43px; line-height:1; }
    .tool-icon { width:47px; height:47px; margin-bottom:auto; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    .folder-card h3 { max-width:100%; margin:18px 0 5px; overflow-wrap:anywhere; font-size:clamp(17px,4.5vw,23px); line-height:1.08; }
    .folder-count { color:var(--muted); font-size:14px; }
    .folder-card.accent .folder-count { color:#202124b8; }
    .card-arrow { position:absolute; right:17px; bottom:48px; font-size:32px; font-weight:300; }
    .footer-note { margin:25px 0 0; padding-top:20px; border-top:1px solid #ffffff1a; color:var(--muted); text-align:center; font-size:13px; }
    .microsoft-panel { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0; padding:12px; border:1px solid var(--border); border-radius:16px; background:var(--panel); }
    .bottom-navigation { position:fixed; left:0; right:0; bottom:0; z-index:100; height:82px; display:grid; grid-template-columns:repeat(5,1fr); align-items:center; padding:8px max(8px,calc((100vw - 760px)/2 + 8px)) env(safe-area-inset-bottom); background:#fafafafa; border-top:1px solid #d7d7d7; box-shadow:0 -10px 30px #00000038; }
    .nav-button { min-width:0; height:58px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:0; background:transparent; color:#595a5e; font-size:11px; font-weight:700; }
    .nav-button .nav-icon { font-size:23px; line-height:1; }
    .nav-button.active { color:var(--yellow-dark); }
    .nav-button.create { width:60px; height:60px; justify-self:center; border-radius:50%; background:var(--yellow); color:#202124; font-size:34px; box-shadow:0 8px 23px #f4c4306b; transform:translateY(-15px); }
    .button.primary { background:linear-gradient(135deg,var(--yellow),var(--yellow-dark)); color:#202124; }
    input:focus, textarea:focus { border-color:var(--yellow); }
    .checkbox { accent-color:var(--yellow); }
    @media(max-width:620px){ .shell{width:100%;margin:0;padding:0 14px 105px;} .hero{min-height:365px;margin:0 -14px;} .hero-top{padding:18px;} .hero-title{left:18px;right:18px;bottom:32px;} .dashboard{padding:27px 8px 25px;} .folder-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;} .folder-card{min-height:160px;padding:16px;border-radius:21px;} .folder-icon{margin:0 0 auto;font-size:38px;} .folder-card h3{margin-top:15px;} .card-arrow{right:13px;bottom:43px;} }
  </style>
</head>

<body>
  <main class="shell">

    <section id="homeView">
      <div class="hero">
        <div class="hero-top">
          <div class="hero-brand"><img class="hero-logo" src="logo-r19.png" alt="R19"><div class="hero-logo-text"><strong>R19</strong><span>MANAGEMENT</span></div></div>
          <button class="profile-button" type="button" aria-label="Perfil"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:27px;height:27px;stroke:white;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21c.8-4.4 3.2-6.6 7.5-6.6s6.7 2.2 7.5 6.6"></path></svg></button>
        </div>
        <div class="hero-title"><h1>R19 Management</h1><p>Comunidad Roble 19</p></div>
      </div>
      <div class="dashboard">
        
        <div class="folder-grid">
          <button class="folder-card accent" type="button" onclick="openSection('pending')">
            <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3 17.7 3.3a2.1 2.1 0 0 1 3 3l-3 3"></path><path d="m13 8 3 3"></path><path d="M5 19 16 8"></path><path d="m4 20 3-1-2-2-1 3Z"></path><path d="m3 5 4-2 4 4-2 2-2-2-2 2-2-4Z"></path><path d="m8.5 8.5 7 7"></path><path d="m14 17 3 3 3-3-3-3"></path></svg>
            <h3>Pendientes</h3><span id="pendingCount" class="folder-count">0 abiertos</span><span class="card-arrow">›</span>
          </button>
          <button class="folder-card" type="button" onclick="openSection('completed')"><span class="folder-icon">✓</span><h3>Reparados</h3><span id="completedCount" class="folder-count">0 reparados</span><span class="card-arrow">›</span></button>
          <button class="folder-card" type="button" onclick="openSection('documents')"><span class="folder-icon">▱</span><h3>Documentación</h3><span id="documentsCount" class="folder-count">0 documentos</span><span class="card-arrow">›</span></button>
          <button class="folder-card accent" type="button" onclick="openSection('contacts')"><span class="folder-icon">👥</span><h3>Contactos</h3><span id="contactsCount" class="folder-count">0 contactos</span><span class="card-arrow">›</span></button>
        </div>
        <div class="footer-note">Roble 19 · Gestión de la comunidad</div>
      </div>
      <div class="microsoft-panel"><span id="connectionStatus" class="status">Solo local</span><button id="syncButton" class="button hidden" type="button">↻ Sincronizar</button><button id="loginButton" class="button" type="button">☁ Conectar OneDrive</button></div>
    </section>
    <section id="sectionView" class="hidden">
      <div class="section-header">
        <div>
          <button class="button" type="button" onclick="goHome()">
            ← Volver a carpetas
          </button>

          <h2 id="sectionTitle"></h2>
          <div id="sectionSubtitle" class="section-subtitle"></div>
        </div>
      </div>

      <div id="sectionForm"></div>
      <div id="sectionList"></div>
    </section>

  </main>

  <script>
    "use strict";

    /* ============================================================
       CONFIGURACIÓN DE R19 MANAGEMENT
       ============================================================ */

    /*
      El Client ID se configurará después de publicar la web
      y registrar R19 Management en Microsoft Entra.
    */
    const MICROSOFT_CLIENT_ID = "PEGA_AQUI_TU_CLIENT_ID";

    /*
      IMPORTANTE:
      Sustituye PEGA_AQUI_EMAIL_ADMINISTRADOR por el correo real,
      manteniendo las comillas.
    */
    const ADMIN_EMAIL = "PEGA_AQUI_EMAIL_ADMINISTRADOR";

    const MICROSOFT_SCOPES = [
      "User.Read",
      "Files.ReadWrite.AppFolder",
      "Mail.Send"
    ];

    const GRAPH_URL = "https://graph.microsoft.com/v1.0";
    const STORAGE_KEY = "r19-management-data-v3";

    let currentSection = "";
    let msalApplication = null;
    let microsoftAccount = null;

    let database = loadDatabase();

    function createEmptyDatabase() {
      return {
        tasks: [],
        documents: [],
        contacts: [],
        updatedAt: new Date().toISOString()
      };
    }

    function loadDatabase() {
      try {
        const storedData = localStorage.getItem(STORAGE_KEY);

        if (!storedData) {
          return createEmptyDatabase();
        }

        const parsedData = JSON.parse(storedData);

        return {
          tasks: Array.isArray(parsedData.tasks)
            ? parsedData.tasks
            : [],

          documents: Array.isArray(parsedData.documents)
            ? parsedData.documents
            : [],

          contacts: Array.isArray(parsedData.contacts)
            ? parsedData.contacts
            : [],

          updatedAt:
            parsedData.updatedAt ||
            new Date().toISOString()
        };
      } catch (error) {
        console.error("No se pudieron cargar los datos:", error);
        return createEmptyDatabase();
      }
    }

    function saveDatabase() {
      database.updatedAt = new Date().toISOString();

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(database)
      );

      updateCounters();

      if (microsoftAccount) {
        synchronizeOneDrive().catch(function (error) {
          console.error("Error de sincronización:", error);
        });
      }
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        function (character) {
          const characters = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#39;"
          };

          return characters[character];
        }
      );
    }

    function formatDate(dateValue) {
      try {
        return new Intl.DateTimeFormat(
          "es-ES",
          {
            dateStyle: "medium",
            timeStyle: "short"
          }
        ).format(new Date(dateValue));
      } catch (error) {
        return "";
      }
    }

    function updateCounters() {
      const pendingTasks = database.tasks.filter(
        function (task) {
          return !task.completed;
        }
      ).length;

      const completedTasks = database.tasks.filter(
        function (task) {
          return task.completed;
        }
      ).length;

      document.getElementById("pendingCount").textContent =
        pendingTasks + (pendingTasks === 1 ? " abierto" : " abiertos");

      document.getElementById("completedCount").textContent =
        completedTasks + (completedTasks === 1 ? " reparado" : " reparados");

      document.getElementById("documentsCount").textContent =
        database.documents.length + (database.documents.length === 1 ? " documento" : " documentos");

      document.getElementById("contactsCount").textContent =
        database.contacts.length + " contactos";
    }

    function goHome() {
      document
        .getElementById("sectionView")
        .classList.add("hidden");

      document
        .getElementById("homeView")
        .classList.remove("hidden");

      updateCounters();
    }

    function openSection(sectionName) {
      currentSection = sectionName;

      document
        .getElementById("homeView")
        .classList.add("hidden");

      document
        .getElementById("sectionView")
        .classList.remove("hidden");

      renderCurrentSection();
    }

    function renderCurrentSection() {
      const title = document.getElementById("sectionTitle");
      const subtitle = document.getElementById("sectionSubtitle");
      const formContainer = document.getElementById("sectionForm");
      const listContainer = document.getElementById("sectionList");

      formContainer.innerHTML = "";
      listContainer.innerHTML = "";

      if (currentSection === "pending") {
        title.textContent = "🛠 Pendientes";
        subtitle.textContent =
          "Asuntos abiertos de la Comunidad R19";

        renderTaskForm(formContainer);
        renderTaskList(listContainer, false);
        return;
      }

      if (currentSection === "completed") {
        title.textContent = "✓ Reparados";
        subtitle.textContent =
          "Histórico de asuntos solucionados";

        renderTaskList(listContainer, true);
        return;
      }

      if (currentSection === "documents") {
        title.textContent = "📁 Documentación";
        subtitle.textContent =
          "Actas, facturas, presupuestos y otros documentos";

        renderDocumentSection(formContainer, listContainer);
        return;
      }

      if (currentSection === "contacts") {
        title.textContent = "👥 Contactos";
        subtitle.textContent =
          "Directorio de la comunidad";

        renderContactSection(formContainer, listContainer);
      }
    }

    function renderTaskForm(container) {
      container.innerHTML = `
        <form class="panel" id="taskForm">
          <h3>Nueva tarea pendiente</h3>

          <label for="taskTitle">
            Título
          </label>

          <input
            id="taskTitle"
            type="text"
            maxlength="160"
            required
            placeholder="Ej. Humedad junto al ascensor"
          >

          <label for="taskNotes">
            Descripción, notas o texto de correo
          </label>

          <textarea
            id="taskNotes"
            placeholder="Describe el problema, las gestiones realizadas o pega aquí el texto del correo."
          ></textarea>

          <label for="taskFiles">
            Fotografías o documentos
          </label>

          <input
            id="taskFiles"
            type="file"
            multiple
            accept="image/*,.pdf,.doc,.docx"
            capture="environment"
          >

          <button class="button primary" type="submit">
            + Añadir tarea
          </button>
        </form>
      `;

      document
        .getElementById("taskForm")
        .addEventListener(
          "submit",
          addTask
        );
    }

    function renderTaskList(container, completedStatus) {
      const selectedTasks = database.tasks
        .filter(function (task) {
          return task.completed === completedStatus;
        })
        .sort(function (taskA, taskB) {
          return (
            new Date(taskB.createdAt) -
            new Date(taskA.createdAt)
          );
        });

      if (selectedTasks.length === 0) {
        container.innerHTML = completedStatus
          ? `<div class="empty">
               No hay tareas completadas.
             </div>`
          : `<div class="empty">
               No hay tareas pendientes.
             </div>`;

        return;
      }

      selectedTasks.forEach(function (task) {
        const taskElement = document.createElement("article");

        taskElement.className =
          "list-item" +
          (task.completed ? " completed" : "");

        const attachments = (task.attachments || [])
          .map(function (attachment) {
            return `
              <span class="attachment">
                📎 ${escapeHTML(attachment.name)}
              </span>
            `;
          })
          .join("");

        const sentInformation = task.sentToAdminAt
          ? `
            <div class="item-meta">
              Enviado a ADMON:
              ${escapeHTML(formatDate(task.sentToAdminAt))}
            </div>
          `
          : "";

        taskElement.innerHTML = `
          <input
            class="checkbox"
            type="checkbox"
            aria-label="Marcar como completada"
            ${task.completed ? "checked" : ""}
          >

          <div>
            <div class="item-title">
              ${escapeHTML(task.title)}
            </div>

            ${
              task.notes
                ? `
                  <div class="item-notes">
                    ${escapeHTML(task.notes)}
                  </div>
                `
                : ""
            }

            <div class="attachments">
              ${attachments}
            </div>

            <div class="item-meta">
              Creada:
              ${escapeHTML(formatDate(task.createdAt))}
            </div>

            ${sentInformation}
          </div>

          <div class="item-actions">
            ${
              !task.completed
                ? `
                  <button
                    class="button small send-admin-button"
                    type="button"
                  >
                    ✉ Enviar a ADMON
                  </button>
                `
                : ""
            }

            <button
              class="button small danger delete-task-button"
              type="button"
            >
              Eliminar
            </button>
          </div>
        `;

        const checkbox =
          taskElement.querySelector(".checkbox");

        checkbox.addEventListener(
          "change",
          function () {
            toggleTaskCompleted(
              task.id,
              checkbox.checked
            );
          }
        );

        const sendButton =
          taskElement.querySelector(
            ".send-admin-button"
          );

        if (sendButton) {
          sendButton.addEventListener(
            "click",
            function () {
              sendTaskToAdministrator(task.id);
            }
          );
        }

        taskElement
          .querySelector(".delete-task-button")
          .addEventListener(
            "click",
            function () {
              deleteTask(task.id);
            }
          );

        container.appendChild(taskElement);
      });
    }

    async function addTask(event) {
      event.preventDefault();

      const title =
        document
          .getElementById("taskTitle")
          .value
          .trim();

      const notes =
        document
          .getElementById("taskNotes")
          .value
          .trim();

      const selectedFiles =
        document
          .getElementById("taskFiles")
          .files;

      const attachments =
        await readSelectedFiles(selectedFiles);

      database.tasks.push({
        id: crypto.randomUUID(),
        title: title,
        notes: notes,
        completed: false,
        createdAt: new Date().toISOString(),
        completedAt: null,
        sentToAdminAt: null,
        attachments: attachments
      });

      saveDatabase();
      renderCurrentSection();
    }

    function toggleTaskCompleted(taskId, completed) {
      const task = database.tasks.find(
        function (currentTask) {
          return currentTask.id === taskId;
        }
      );

      if (!task) {
        return;
      }

      task.completed = completed;

      task.completedAt = completed
        ? new Date().toISOString()
        : null;

      saveDatabase();
      renderCurrentSection();
    }

    function deleteTask(taskId) {
      const confirmation = window.confirm(
        "¿Quieres eliminar esta tarea?"
      );

      if (!confirmation) {
        return;
      }

      database.tasks = database.tasks.filter(
        function (task) {
          return task.id !== taskId;
        }
      );

      saveDatabase();
      renderCurrentSection();
    }

    async function addDocument(event) {
      event.preventDefault();

      const title =
        document
          .getElementById("documentTitle")
          .value
          .trim();

      const category =
        document
          .getElementById("documentCategory")
          .value
          .trim();

      const selectedFile =
        document
          .getElementById("documentFile")
          .files[0];

      const processedFiles =
        await readSelectedFiles([selectedFile]);

      const processedFile = processedFiles[0];

      database.documents.push({
        id: crypto.randomUUID(),
        title: title,
        category: category,
        fileName: processedFile.name,
        file: processedFile,
        createdAt: new Date().toISOString()
      });

      saveDatabase();
      renderCurrentSection();
    }

    function addContact(event) {

      database.contacts.push({
        id: crypto.randomUUID(),

        name:
          document

            .value
            .trim(),

            .value
            .trim(),

    function readSelectedFiles(fileList) {
      const files = Array.from(fileList);

      return Promise.all(
        files.map(function (file) {
          return new Promise(
            function (resolve, reject) {
              const reader = new FileReader();

              reader.onload = function () {
                resolve({
                  id: crypto.randomUUID(),
                  name: file.name,
                  type:
                    file.type ||
                    "application/octet-stream",
                  size: file.size,
                  data: reader.result
                });
              };

              reader.onerror = reject;
              reader.readAsDataURL(file);
            }
          );
        })
      );
    }

    /* ============================================================
       MICROSOFT / ONEDRIVE / EMAIL
       ============================================================ */

    async function initializeMicrosoft() {
      if (
        MICROSOFT_CLIENT_ID.includes(
          "PEGA_AQUI"
        )
      ) {
        return;
      }

      msalApplication =
        new msal.PublicClientApplication({
          auth: {
            clientId: MICROSOFT_CLIENT_ID,
            authority:
              "https://login.microsoftonline.com/common",

            redirectUri:
              window.location.origin +
              window.location.pathname
          },

          cache: {
            cacheLocation: "localStorage"
          }
        });

      await msalApplication.initialize();
      await msalApplication.handleRedirectPromise();

      microsoftAccount =
        msalApplication.getAllAccounts()[0] ||
        null;

      updateMicrosoftInterface();
    }

    function updateMicrosoftInterface() {
      const status =
        document.getElementById(
          "connectionStatus"
        );

      const loginButton =
        document.getElementById(
          "loginButton"
        );

      const syncButton =
        document.getElementById(
          "syncButton"
        );

      if (microsoftAccount) {
        status.textContent =
          microsoftAccount.username;

        status.classList.add("connected");

        loginButton.textContent =
          "Salir de Microsoft";

        syncButton.classList.remove("hidden");
      } else {
        status.textContent = "Solo local";
        status.classList.remove("connected");

        loginButton.textContent =
          "☁ Conectar OneDrive";

        syncButton.classList.add("hidden");
      }
    }

    async function loginOrLogoutMicrosoft() {
      if (microsoftAccount) {
        await msalApplication.logoutPopup({
          account: microsoftAccount
        });

        microsoftAccount = null;
        updateMicrosoftInterface();
        return;
      }

      if (
        MICROSOFT_CLIENT_ID.includes(
          "PEGA_AQUI"
        )
      ) {
        alert(
          "Todavía falta configurar el Microsoft Client ID."
        );

        return;
      }

      if (!msalApplication) {
        await initializeMicrosoft();
      }

      const loginResponse =
        await msalApplication.loginPopup({
          scopes: MICROSOFT_SCOPES,
          prompt: "select_account"
        });

      microsoftAccount =
        loginResponse.account;

      updateMicrosoftInterface();
      await synchronizeOneDrive();
    }

    async function getAccessToken() {
      try {
        const tokenResponse =
          await msalApplication.acquireTokenSilent({
            scopes: MICROSOFT_SCOPES,
            account: microsoftAccount
          });

        return tokenResponse.accessToken;
      } catch (error) {
        const tokenResponse =
          await msalApplication.acquireTokenPopup({
            scopes: MICROSOFT_SCOPES,
            account: microsoftAccount
          });

        return tokenResponse.accessToken;
      }
    }

    async function callMicrosoftGraph(
      path,
      options = {}
    ) {
      const accessToken =
        await getAccessToken();

      const response = await fetch(
        GRAPH_URL + path,
        {
          ...options,

          headers: {
            Authorization:
              "Bearer " + accessToken,

            ...(options.headers || {})
          }
        }
      );

      if (!response.ok) {
        const errorText =
          await response.text();

        throw new Error(
          "Microsoft Graph " +
          response.status +
          ": " +
          errorText
        );
      }

      if (
        response.status === 202 ||
        response.status === 204
      ) {
        return null;
      }

      return response.json();
    }

    async function synchronizeOneDrive() {
      if (!microsoftAccount) {
        return;
      }

      const status =
        document.getElementById(
          "connectionStatus"
        );

      status.textContent =
        "Sincronizando...";

      const databaseFile = new Blob(
        [
          JSON.stringify(
            database,
            null,
            2
          )
        ],
        {
          type: "application/json"
        }
      );

      await callMicrosoftGraph(
        "/me/drive/special/approot:/r19-management.json:/content",
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: databaseFile
        }
      );

      status.textContent = "Sincronizado";
      status.classList.add("connected");
    }

    function getBase64Content(dataURL) {
      return dataURL.split(",")[1];
    }

    async function sendTaskToAdministrator(taskId) {
      if (
        ADMIN_EMAIL.includes(
          "PEGA_AQUI"
        )
      ) {
        alert(
          "Falta configurar el email del administrador en ADMIN_EMAIL."
        );

        return;
      }

      if (!microsoftAccount) {
        alert(
          "Conecta primero tu cuenta Microsoft."
        );

        return;
      }

      const task = database.tasks.find(
        function (currentTask) {
          return currentTask.id === taskId;
        }
      );

      if (!task) {
        return;
      }

      const confirmation = window.confirm(
        "¿Enviar esta tarea y sus archivos a " +
        ADMIN_EMAIL +
        "?"
      );

      if (!confirmation) {
        return;
      }

      const emailAttachments =
        (task.attachments || []).map(
          function (attachment) {
            return {
              "@odata.type":
                "#microsoft.graph.fileAttachment",

              name: attachment.name,

              contentType:
                attachment.type ||
                "application/octet-stream",

              contentBytes:
                getBase64Content(
                  attachment.data
                )
            };
          }
        );

      const emailBody = `
        <p>Buenos días,</p>

        <p>
          Se comunica la siguiente tarea pendiente
          de la Comunidad R19:
        </p>

        <p>
          <strong>
            ${escapeHTML(task.title)}
          </strong>
        </p>

        ${
          task.notes
            ? `
              <p>
                ${escapeHTML(task.notes).replace(
                  /\n/g,
                  "<br>"
                )}
              </p>
            `
            : ""
        }

        <p>
          Se adjuntan las fotografías o documentos
          disponibles.
        </p>

        <p>Un saludo.</p>
      `;

      await callMicrosoftGraph(
        "/me/sendMail",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: {
              subject:
                "R19 - " + task.title,

              body: {
                contentType: "HTML",
                content: emailBody
              },

              toRecipients: [
                {
                  emailAddress: {
                    address: ADMIN_EMAIL
                  }
                }
              ],

              attachments:
                emailAttachments
            },

            saveToSentItems: true
          })
        }
      );

      task.sentToAdminAt =
        new Date().toISOString();

      saveDatabase();
      renderCurrentSection();

      alert(
        "Email enviado correctamente a ADMON."
      );
    }

    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        function () {
          loginOrLogoutMicrosoft().catch(
            function (error) {
              console.error(error);

              alert(
                "No se pudo conectar con Microsoft: " +
                error.message
              );
            }
          );
        }
      );

    document
      .getElementById("syncButton")
      .addEventListener(
        "click",
        function () {
          synchronizeOneDrive()
            .then(function () {
              alert(
                "Datos sincronizados con OneDrive."
              );
            })
            .catch(function (error) {
              console.error(error);

              alert(
                "No se pudo sincronizar: " +
                error.message
              );
            });
        }
      );

    updateCounters();

    initializeMicrosoft().catch(
      function (error) {
        console.error(
          "No se pudo inicializar Microsoft:",
          error
        );
      }
    );
  </script>
